name: Build y Release
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Obtener Fecha Actual
        run: echo "DATE=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Limpiar build anterior
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path build) { Remove-Item -Recurse -Force build }
        shell: pwsh

      - name: Convertir PNG a ICO
        run: |
          pip install Pillow
          python -c "from PIL import Image; img = Image.open('specs/media/PressGenLogo.png'); img.save('specs/media/PressGenLogo.ico')"

      - name: Compilar con PyInstaller # --noconsole le saca la consola (duh)
        run: |
          pyinstaller --onefile --noconsole --name "Presgen" --icon "specs/media/PressGenLogo.ico" bin/main.py

      - name: Verificar ejecutable # ← ahora DESPUÉS de compilar
        run: dir dist\

      - name: Obtener versión del commit
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.version.outputs.sha }}
          name: "Build ${{ steps.version.outputs.sha }}"
          files: dist/Presgen.exe
          body: |
            Version Compilada Automaticamente
            Commit: ${{ github.event.head_commit.message }}
            Fecha: ${{ env.DATE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
